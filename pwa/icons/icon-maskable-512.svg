<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <!-- Maskable icon: full-bleed background. Content kept inside the inner ~80% safe zone
       so Android's adaptive-icon crop (circle, squircle, square) never clips the candles. -->
  <rect width="512" height="512" fill="#07090f"/>

  <!-- Analytical trend line: connects upper wick tops, ascending left→right -->
  <line x1="166" y1="246" x2="346" y2="178" stroke="#d4941a" stroke-width="5" stroke-dasharray="9,11" opacity="0.55" stroke-linecap="round"/>

  <!-- Bear candle (left, lowest top) -->
  <line x1="166" y1="246" x2="166" y2="268" stroke="#c91f3a" stroke-width="11" stroke-linecap="round"/>
  <rect x="142" y="268" width="48" height="78" rx="6" fill="#c91f3a"/>
  <line x1="166" y1="346" x2="166" y2="368" stroke="#c91f3a" stroke-width="11" stroke-linecap="round"/>

  <!-- Doji candle (middle) -->
  <line x1="256" y1="208" x2="256" y2="284" stroke="#d4941a" stroke-width="9" stroke-linecap="round"/>
  <rect x="232" y="284" width="48" height="12" rx="4" fill="#d4941a"/>
  <line x1="256" y1="296" x2="256" y2="368" stroke="#d4941a" stroke-width="9" stroke-linecap="round"/>

  <!-- Bull candle (right, tallest top) -->
  <line x1="346" y1="178" x2="346" y2="200" stroke="#09a86e" stroke-width="11" stroke-linecap="round"/>
  <rect x="322" y="200" width="48" height="146" rx="6" fill="#09a86e"/>
  <line x1="346" y1="346" x2="346" y2="368" stroke="#09a86e" stroke-width="11" stroke-linecap="round"/>

  <!-- Studio "stage" baseline -->
  <line x1="142" y1="394" x2="370" y2="394" stroke="#d4941a" stroke-width="4" opacity="0.35" stroke-linecap="round"/>
</svg>
