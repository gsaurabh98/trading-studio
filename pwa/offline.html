<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#07090f" media="(prefers-color-scheme: dark)">
  <meta name="theme-color" content="#f8fafc" media="(prefers-color-scheme: light)">
  <title>Offline — Trading Studio</title>
  <style>
    :root {
      --bg: #07090f;
      --card: #0f1422;
      --text: #ffffff;
      --muted: #b0c4e8;
      --bull: #09a86e;
      --bear: #c91f3a;
      --neutral: #d4941a;
      --bd: rgba(255, 255, 255, 0.07);
    }

    @media (prefers-color-scheme: light) {
      :root {
        --bg: #f8fafc;
        --card: #ffffff;
        --text: #0f172a;
        --muted: #475569;
        --bd: rgba(15, 23, 42, 0.1);
      }
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html,
    body {
      height: 100%;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'IBM Plex Sans', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      display: grid;
      place-items: center;
      padding: 24px;
      line-height: 1.55;
      -webkit-font-smoothing: antialiased;
    }

    main {
      max-width: 440px;
      width: 100%;
      text-align: center;
      padding: 32px 28px;
      background: var(--card);
      border: 1px solid var(--bd);
      border-radius: 16px;
    }

    .candles {
      display: inline-flex;
      align-items: flex-end;
      gap: 8px;
      margin-bottom: 24px;
      opacity: 0.85;
    }

    .candles svg {
      width: 88px;
      height: 88px;
    }

    h1 {
      font-size: 1.4rem;
      font-weight: 700;
      letter-spacing: 0.01em;
      margin-bottom: 12px;
    }

    p {
      color: var(--muted);
      font-size: 0.95rem;
      margin-bottom: 18px;
    }

    .row {
      display: flex;
      gap: 10px;
      justify-content: center;
      flex-wrap: wrap;
      margin-top: 20px;
    }

    button,
    a.btn {
      appearance: none;
      border: 1px solid var(--bd);
      background: transparent;
      color: var(--text);
      font: inherit;
      font-weight: 600;
      font-size: 0.9rem;
      letter-spacing: 0.02em;
      padding: 10px 18px;
      border-radius: 8px;
      cursor: pointer;
      text-decoration: none;
      transition: background 0.15s, border-color 0.15s;
      touch-action: manipulation;
    }

    button.primary {
      background: var(--bull);
      border-color: var(--bull);
      color: #fff;
    }

    button:hover,
    a.btn:hover {
      border-color: var(--bull);
    }

    .hint {
      font-size: 0.78rem;
      color: var(--muted);
      margin-top: 22px;
      letter-spacing: 0.02em;
    }
  </style>
</head>

<body>
  <main>
    <div class="candles" aria-hidden="true">
      <svg viewBox="0 0 192 192">
        <g transform="translate(40 32)">
          <line x1="20" y1="6" x2="20" y2="20" stroke="#c91f3a" stroke-width="6" stroke-linecap="round" />
          <rect x="6" y="20" width="28" height="64" rx="3" fill="#c91f3a" />
          <line x1="20" y1="84" x2="20" y2="98" stroke="#c91f3a" stroke-width="6" stroke-linecap="round" />
          <line x1="56" y1="58" x2="56" y2="68" stroke="#d4941a" stroke-width="5" stroke-linecap="round" />
          <rect x="44" y="68" width="24" height="12" rx="2.5" fill="#d4941a" />
          <line x1="56" y1="80" x2="56" y2="90" stroke="#d4941a" stroke-width="5" stroke-linecap="round" />
          <line x1="92" y1="0" x2="92" y2="14" stroke="#09a86e" stroke-width="6" stroke-linecap="round" />
          <rect x="78" y="14" width="28" height="74" rx="3" fill="#09a86e" />
          <line x1="92" y1="88" x2="92" y2="104" stroke="#09a86e" stroke-width="6" stroke-linecap="round" />
        </g>
      </svg>
    </div>
    <h1>You're offline</h1>
    <p>The educational content (patterns, playbooks, glossary, calculators) works offline — but the live chart and option chain need a connection to Upstox.</p>
    <div class="row">
      <button class="primary" type="button" onclick="window.location.reload()">Retry connection</button>
      <a class="btn" href="./candlestick-patterns.html#anatomy">Browse offline content</a>
    </div>
    <div class="hint">The app shell is cached, so patterns, glossary, and calculators stay available even without network.</div>
  </main>
</body>

</html>
